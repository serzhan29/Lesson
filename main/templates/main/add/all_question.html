{% extends "base.html" %}

{% block content %}
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- FontAwesome для иконок -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

<style>
body {
    font-family: "Montserrat Alternates", sans-serif;
}
a{
    text-decoration: none;
    color: black;
}
.container {
  max-width: 1900px;
  margin-inline: 1.5rem;
}
.card-link {
    transition: all 0.3s ease;
}
.card-link:hover {
    transform: translateY(-5px);
    box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
    text-decoration: none;
}
.card-img-top {
    height: 180px;
    object-fit: cover;
}
</style>

<div class="container py-5">
    <h2 class="mb-5 fw-semibold text-center">
        📚 Сұрақтар мен ресурстар
    </h2>

    <div class="row g-4 justify-content-center">
        <!-- Карточка Емтихан сұрақтары -->
        <div class="col-md-6 col-lg-4">
            <a href="{% url 'exam' %}" class="card card-link border-0 shadow-sm h-100 text-dark">
                <!-- Если нужно фото, раскомментируй -->
                <img src="https://avatars.mds.yandex.net/i?id=b86a3866e9f2c51dbfd424ba4a7c0479_l-4937827-images-thumbs&n=13" class="card-img-top" alt="Емтихан сұрақтары">
                <div class="card-body text-center">
                    <i class="fa-solid fa-file-lines fa-2x text-primary mb-3"></i>
                    <h5 class="card-title">Емтихан сұрақтары</h5>
                    <p class="card-text">Барлық емтихан сұрақтары осы бетте орналасқан.</p>
                </div>
            </a>
        </div>

        <!-- Карточка БӨЖ тақырыптары -->
        <div class="col-md-6 col-lg-4">
            <a href="{% url 'list_topic' %}" class="card card-link border-0 shadow-sm h-100 text-dark">
                <img src="https://psiola-center.ru/wp-content/uploads/9/1/d/91dc5377ea1a87185dfe2c84d16fcc22.jpeg" class="card-img-top" alt="БӨЖ тақырыптары">
                <div class="card-body text-center">
                    <i class="fa-solid fa-list-check fa-2x text-success mb-3"></i>
                    <h5 class="card-title">Практикалық сұрақтар</h5>
                    <p class="card-text">БӨЖ (Өзіндік жұмыстар) үшін тақырыптардың тізімі.</p>
                </div>
            </a>
        </div>

        <!-- Карточка Пайдалы сілтемелер -->
        <div class="col-md-6 col-lg-4">
            <a href="{% url 'links' %}" class="card card-link border-0 shadow-sm h-100 text-dark">
                <img src="https://i.pinimg.com/originals/f9/4a/80/f94a80b84c5d484560009acc8543fb98.jpg" class="card-img-top" alt="Сілтемелер">
                <div class="card-body text-center">
                    <i class="fa-solid fa-link fa-2x text-warning mb-3"></i>
                    <h5 class="card-title">Тесттер</h5>
                    <p class="card-text">Онлайн тесттер</p>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
